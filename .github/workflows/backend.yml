name: Backend CI

on:
  push:
    paths:
      - "back-end/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "back-end/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smarthire_ats_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql, dom, curl, libxml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: back-end/vendor
          key: composer-${{ hashFiles('back-end/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env files
        run: |
          cp .env.example .env
          cp .env.example .env.testing

      - name: Configure CI test database
        run: |
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=smarthire_ats_testing/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env.testing

      - name: Generate app key
        run: php artisan key:generate

      - name: Clear application cache
        run: |
          php artisan config:clear
          php artisan route:clear

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Seed roles & permissions
        run: php artisan db:seed --class=RolesAndPermissionsSeeder --env=testing --force

      - name: Run Laravel Pint (code style)
        run: vendor/bin/pint

      - name: Run Pest tests
        run: vendor/bin/pest --ci